name: Human test needed
description: Something only a person can verify (real library, external disk, visuals, clean machine)
labels: [needs-human-test]
body:
  - type: textarea
    id: what
    attributes:
      label: What to test
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
  - type: input
    id: version
    attributes:
      label: Build / version / PR
