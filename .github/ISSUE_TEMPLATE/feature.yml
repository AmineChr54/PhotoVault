name: Feature
description: New feature or improvement
labels: [feature]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P1-high, P2-medium, P3-low]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: Acceptance criteria
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, ui, ai, build]
