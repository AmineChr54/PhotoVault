name: Bug
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 = can lose/corrupt photos or break undo, P1 = crash / main flow broken, P2 = degraded UX, P3 = polish
      options: [P0-critical, P1-high, P2-medium, P3-low]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, ui, ai, build]
